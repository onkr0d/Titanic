services:
  app:
    image: ghcr.io/onkr0d/titanic/trimmer:latest
    # Matches the non-root user baked into the Dockerfile. Was "0:0", which
    # silently discarded that hardening.
    user: "1000:1000"
    restart: unless-stopped
    # no published ports on purpose: the app has no auth; Umbrel's app_proxy provides it
    environment:
      - RUST_LOG=info
      - MEDIA_PATH=/downloads
      - DATA_DIR=/data
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${UMBREL_ROOT}/home/Downloads:/downloads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3030/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
